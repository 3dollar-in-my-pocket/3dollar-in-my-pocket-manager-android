name: Test

# 모든 PR에서 실행 (스택 PR처럼 base가 feature 브랜치여도)
# 결과 요약·TC 커버리지 표는 scripts/test-summary.sh 가 만든다. 기준: docs/process/testing.md
on:
  pull_request:

# 같은 PR에 새 푸시가 오면 이전 실행은 취소
concurrency:
  group: test-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write   # 결과 코멘트

jobs:
  unit-test:
    name: 유닛 테스트 (testDebugUnitTest)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # app/data 의 build.gradle.kts 와 build-logic 의 configureKotlinAndroid 가 local.properties 를 무조건 읽고,
      # app 은 값을 `as String` 으로 캐스팅하므로 키가 없으면 설정 단계에서 실패한다.
      # 유닛 테스트는 네트워크·지도·카카오를 쓰지 않으므로 시크릿 없이 자리표시 값만 넣는다.
      - name: Create local.properties
        run: |
          cat << EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          kakao_key_dev="ci-placeholder"
          kakao_key_release="ci-placeholder"
          base_url_dev="https://ci.invalid/"
          base_url_release="https://ci.invalid/"
          naver_map_client_id=ci-placeholder
          EOF

      # :app 의 google-services 플러그인이 debug variant 용 google-services.json 을 요구한다 (gitignore 대상).
      # (:feature:home 에도 플러그인이 적용돼 있지만 library 라 경고만 내고 파일을 요구하지 않는다.)
      # 유닛 테스트는 Firebase 에 접속하지 않으므로 패키지명만 맞춘 자리표시 파일을 만든다.
      - name: Create placeholder google-services.json
        run: |
          python3 - << 'PY'
          import json, os
          pkgs = ["app.threedollars.manager.debug"]
          conf = {
              "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
              "client": [{
                  "client_info": {"mobilesdk_app_id": f"1:000000000000:android:{i:016x}", "android_client_info": {"package_name": p}},
                  "oauth_client": [], "api_key": [{"current_key": "ci-placeholder"}],
                  "services": {"appinvite_service": {"other_platform_oauth_client": []}},
              } for i, p in enumerate(pkgs, 1)],
              "configuration_version": "1",
          }
          os.makedirs("app/src/debug", exist_ok=True)
          with open("app/src/debug/google-services.json", "w") as f:
              json.dump(conf, f)
          PY

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: testDebugUnitTest
        id: test
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace
        continue-on-error: true

      - name: 결과 요약 (Job Summary)
        if: always()
        run: |
          mkdir -p build
          scripts/test-summary.sh > build/summary.md
          cat build/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: 결과 코멘트 (PR, 갱신형)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          MARK="<!-- test-evidence -->"
          { echo "$MARK"; cat build/summary.md; echo; echo "_[워크플로 실행](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"; } > build/comment.md
          ID="$(gh api "repos/$REPO/issues/$PR/comments" --paginate --jq ".[] | select(.body | startswith(\"$MARK\")) | .id" | head -1)"
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@build/comment.md > /dev/null
          else
            gh pr comment "$PR" --repo "$REPO" --body-file build/comment.md
          fi

      - name: 테스트 리포트 아티팩트
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/build/test-results/**/*.xml'
          retention-days: 14
          if-no-files-found: ignore

      - name: 실패 판정
        if: always()
        run: |
          if [ "${{ steps.test.outcome }}" != "success" ]; then
            echo "::error::유닛 테스트가 실패했거나 실행되지 못했습니다. 위 'testDebugUnitTest' 스텝 로그와 결과 코멘트를 확인하세요."
            exit 1
          fi
