name: Play Release

# release AAB(app.threedollars.manager)를 Google Play 에 올린다.
#   - release/** 브랜치에서 app/build.gradle.kts(버전)가 바뀐 커밋이 push 되면 → 프로덕션 트랙 초안(draft)
#   - 수동 실행 → 내부 테스트(completed) 또는 프로덕션 초안(draft)
# 버전(versionCode/versionName)은 사람이 app/build.gradle.kts 에서 올린다. 이 워크플로는 버전을 바꾸거나 커밋하지 않는다.
# 필요한 시크릿과 Play Console 설정: docs/process/play-release.md
on:
  # TODO(TH-1385): 머지 전 제거. PR 브랜치에서 수동 실행을 검증하려고 워크플로를 등록시키는 임시 트리거.
  pull_request:
    paths:
      - '.github/workflows/play-release.yml'
  push:
    branches:
      - 'release/**'
    paths:
      - 'app/build.gradle.kts'
  workflow_dispatch:
    inputs:
      track:
        description: 'internal = 내부 테스트 즉시 배포, production = 프로덕션 초안(Play Console 에서 검토 후 출시)'
        required: true
        default: 'internal'
        type: choice
        options:
          - internal
          - production

concurrency:
  group: play-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 트랙 결정
        id: track
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TRACK: ${{ github.event.inputs.track }}
        run: |
          if [ "$EVENT_NAME" = "push" ]; then TRACK=production; else TRACK="$INPUT_TRACK"; fi
          if [ "$TRACK" = "internal" ]; then STATUS=completed; LABEL="내부 테스트"; else STATUS=draft; LABEL="프로덕션 초안"; fi
          { echo "track=$TRACK"; echo "status=$STATUS"; echo "label=$LABEL"; } >> "$GITHUB_OUTPUT"

      - name: 필수 시크릿 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KAKAO_KEY_DEV: ${{ secrets.KAKAO_KEY_DEV }}
          KAKAO_KEY_RELEASE: ${{ secrets.KAKAO_KEY_RELEASE }}
          BASE_URL_DEV: ${{ secrets.BASE_URL_DEV }}
          BASE_URL_RELEASE: ${{ secrets.BASE_URL_RELEASE }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          GOOGLE_SERVICES_JSON_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KAKAO_KEY_DEV KAKAO_KEY_RELEASE BASE_URL_DEV BASE_URL_RELEASE NAVER_MAP_CLIENT_ID \
                      GOOGLE_SERVICES_JSON_RELEASE GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::레포 Actions 시크릿이 없습니다:$missing — docs/process/play-release.md 참고"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName *=' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode *=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::app/build.gradle.kts 에서 versionName/versionCode 를 읽지 못했습니다"
            exit 1
          fi
          { echo "version_name=$VERSION_NAME"; echo "version_code=$VERSION_CODE"; echo "release_name=v${VERSION_NAME} (${VERSION_CODE})"; } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # release signingConfig 가 app/ThreeDollarsManager.jks 를 쓴다. Play 에 등록된 업로드 키와 같아야 한다.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/ThreeDollarsManager.jks

      # firebase-distribution.yml 과 같은 방식. 설정 단계에서 debug·release 키를 모두 읽으므로 전부 필요하다.
      - name: Create local.properties
        env:
          KAKAO_KEY_DEV: ${{ secrets.KAKAO_KEY_DEV }}
          KAKAO_KEY_RELEASE: ${{ secrets.KAKAO_KEY_RELEASE }}
          BASE_URL_DEV: ${{ secrets.BASE_URL_DEV }}
          BASE_URL_RELEASE: ${{ secrets.BASE_URL_RELEASE }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
        run: |
          unquote() { local v="$1"; v="${v#\"}"; v="${v%\"}"; printf '%s' "$v"; }
          quote() { printf '"%s"' "$(unquote "$1")"; }
          cat << EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          kakao_key_dev=$(quote "$KAKAO_KEY_DEV")
          kakao_key_release=$(quote "$KAKAO_KEY_RELEASE")
          base_url_dev=$(quote "$BASE_URL_DEV")
          base_url_release=$(quote "$BASE_URL_RELEASE")
          naver_map_client_id=$(unquote "$NAVER_MAP_CLIENT_ID")
          EOF

      # release variant 용. app.threedollars.manager 클라이언트가 들어 있어야 한다.
      - name: Create google-services.json (release)
        env:
          GOOGLE_SERVICES_JSON_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
        run: |
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON_RELEASE" > app/src/release/google-services.json
          grep -q '"app.threedollars.manager"' app/src/release/google-services.json \
            || { echo "::error::GOOGLE_SERVICES_JSON_RELEASE 에 app.threedollars.manager 패키지가 없습니다"; exit 1; }

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        id: aab
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      # 지난 릴리즈(origin/master) 이후 커밋으로 "새로운 기능" 문구를 만든다.
      # Play 는 언어당 500자(유니코드 문자, 끝 개행 포함) 제한이라 넘으면 업로드가 실패한다.
      - name: Prepare release notes
        run: |
          git fetch -q origin master || true
          COMMITS=$(git log --no-merges --pretty=format:"- %s" origin/master..HEAD 2>/dev/null || true)
          [ -n "$COMMITS" ] || COMMITS="- ${{ steps.version.outputs.release_name }} 릴리즈"
          mkdir -p distribution/whatsnew
          python3 - "$COMMITS" > distribution/whatsnew/whatsnew-ko-KR << 'PY'
          import sys
          LIMIT, ELLIPSIS = 500, "..."
          MAX_TEXT = LIMIT - 1
          text = sys.argv[1].strip()
          if len(text) > MAX_TEXT:
              budget = MAX_TEXT - len(ELLIPSIS) - 1
              kept, total = [], 0
              for line in text.split("\n"):
                  if total + len(line) > budget:
                      break
                  kept.append(line)
                  total += len(line) + 1
              text = "\n".join(kept + [ELLIPSIS]) if kept else text[:MAX_TEXT - len(ELLIPSIS)] + ELLIPSIS
          assert len(text) + 1 <= LIMIT
          sys.stdout.write(text + "\n")
          PY
          cat distribution/whatsnew/whatsnew-ko-KR

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.threedollars.manager
          releaseFiles: ${{ steps.aab.outputs.path }}
          tracks: ${{ steps.track.outputs.track }}
          status: ${{ steps.track.outputs.status }}
          releaseName: ${{ steps.version.outputs.release_name }}
          whatsNewDirectory: distribution/whatsnew

      - name: Notify Discord
        if: always()
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          STATUS: ${{ job.status }}
          LABEL: ${{ steps.track.outputs.label }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$DISCORD_WEBHOOK_URL" ] || { echo "DISCORD_WEBHOOK_URL 없음 — 알림 생략"; exit 0; }
          if [ "$STATUS" = "success" ]; then
            TITLE="🚀 [사장님앱 AOS] Play ${LABEL} 업로드 완료"; COLOR=3066993
          else
            TITLE="❌ [사장님앱 AOS] Play ${LABEL} 업로드 실패"; COLOR=15158332
          fi
          PAYLOAD=$(jq -n --arg t "$TITLE" --argjson c "$COLOR" --arg v "${RELEASE_NAME:--}" --arg b "$GITHUB_REF_NAME" --arg u "$RUN_URL" \
            '{username: "GitHub Actions", allowed_mentions: {parse: []},
              embeds: [{title: $t, color: $c, url: $u,
                description: "[Play Console](https://play.google.com/console) · [스토어](https://play.google.com/store/apps/details?id=app.threedollars.manager)",
                fields: [{name: "버전", value: $v, inline: true}, {name: "브랜치", value: $b, inline: true}]}]}')
          curl --fail-with-body --silent --show-error --retry 2 -H 'Content-Type: application/json' --data "$PAYLOAD" "${DISCORD_WEBHOOK_URL}?wait=true" > /dev/null
