name: Play Release

# release/** 브랜치에서 수동 실행한다. release AAB(app.threedollars.manager)를 내부 테스트·프로덕션에 올리고 프로덕션 심사 제출까지 한다.
# 관리형 게시가 꺼져 있으면 심사 통과 즉시 출시된다. 버전은 사람이(또는 /3dollars:release-playstore 가) app/build.gradle.kts 에서 올린다.
# 필요한 시크릿과 순서: docs/process/play-release.md
#   gh workflow run "Play Release" --ref release/1.4.0 -f whats_new="$(cat whats_new.txt)"
on:
  workflow_dispatch:
    inputs:
      whats_new:
        description: '이번 버전의 새로운 기능 (스토어 노출, 500자 이하)'
        required: true
      dry_run:
        description: '업로드·검증만 하고 커밋하지 않기'
        type: boolean
        required: false
        default: false

concurrency:
  group: play-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 브랜치 확인
        if: ${{ !startsWith(github.ref_name, 'release/') }}
        run: |
          echo "::error::release/** 브랜치에서만 실행한다 (현재 ${{ github.ref_name }})"
          exit 1

      - name: 필수 시크릿 확인
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KAKAO_KEY_DEV: ${{ secrets.KAKAO_KEY_DEV }}
          KAKAO_KEY_RELEASE: ${{ secrets.KAKAO_KEY_RELEASE }}
          BASE_URL_DEV: ${{ secrets.BASE_URL_DEV }}
          BASE_URL_RELEASE: ${{ secrets.BASE_URL_RELEASE }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
          GOOGLE_SERVICES_JSON_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          missing=""
          for name in KEYSTORE_BASE64 KAKAO_KEY_DEV KAKAO_KEY_RELEASE BASE_URL_DEV BASE_URL_RELEASE NAVER_MAP_CLIENT_ID \
                      GOOGLE_SERVICES_JSON_RELEASE GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::레포 Actions 시크릿이 없습니다:$missing — docs/process/play-release.md 참고"
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION_NAME=$(grep -E 'versionName *=' app/build.gradle.kts | head -1 | sed -E 's/.*"(.*)".*/\1/')
          VERSION_CODE=$(grep -E 'versionCode *=' app/build.gradle.kts | head -1 | grep -oE '[0-9]+')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::app/build.gradle.kts 에서 versionName/versionCode 를 읽지 못했습니다"
            exit 1
          fi
          { echo "version_name=$VERSION_NAME"; echo "version_code=$VERSION_CODE"; echo "release_name=v${VERSION_NAME}"; } >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 # v3.5.0

      # release signingConfig 가 app/ThreeDollarsManager.jks 를 쓴다. Play 에 등록된 업로드 키와 같아야 한다.
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_BASE64" | base64 -d > app/ThreeDollarsManager.jks

      # firebase-distribution.yml 과 같은 방식. 설정 단계에서 debug·release 키를 모두 읽으므로 전부 필요하다.
      - name: Create local.properties
        env:
          KAKAO_KEY_DEV: ${{ secrets.KAKAO_KEY_DEV }}
          KAKAO_KEY_RELEASE: ${{ secrets.KAKAO_KEY_RELEASE }}
          BASE_URL_DEV: ${{ secrets.BASE_URL_DEV }}
          BASE_URL_RELEASE: ${{ secrets.BASE_URL_RELEASE }}
          NAVER_MAP_CLIENT_ID: ${{ secrets.NAVER_MAP_CLIENT_ID }}
        run: |
          unquote() { local v="$1"; v="${v#\"}"; v="${v%\"}"; printf '%s' "$v"; }
          quote() { printf '"%s"' "$(unquote "$1")"; }
          cat << EOF > local.properties
          sdk.dir=${ANDROID_HOME}
          kakao_key_dev=$(quote "$KAKAO_KEY_DEV")
          kakao_key_release=$(quote "$KAKAO_KEY_RELEASE")
          base_url_dev=$(quote "$BASE_URL_DEV")
          base_url_release=$(quote "$BASE_URL_RELEASE")
          naver_map_client_id=$(unquote "$NAVER_MAP_CLIENT_ID")
          EOF

      # release variant 용. app.threedollars.manager 클라이언트가 들어 있어야 한다.
      - name: Create google-services.json (release)
        env:
          GOOGLE_SERVICES_JSON_RELEASE: ${{ secrets.GOOGLE_SERVICES_JSON_RELEASE }}
        run: |
          mkdir -p app/src/release
          printf '%s' "$GOOGLE_SERVICES_JSON_RELEASE" > app/src/release/google-services.json
          grep -q '"app.threedollars.manager"' app/src/release/google-services.json \
            || { echo "::error::GOOGLE_SERVICES_JSON_RELEASE 에 app.threedollars.manager 패키지가 없습니다"; exit 1; }

      - name: gradlew 실행 권한
        run: chmod +x gradlew

      - name: Build release AAB
        run: ./gradlew bundleRelease --no-daemon --stacktrace

      - name: Verify AAB
        id: aab
        run: |
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$AAB"
          echo "path=$AAB" >> "$GITHUB_OUTPUT"

      - name: 새로운 기능 문구
        env:
          WHATS_NEW: ${{ inputs.whats_new }}
        run: |
          mkdir -p distribution
          printf '%s' "$WHATS_NEW" > distribution/whats_new.txt
          python3 -c "import sys; t=open(sys.argv[1],encoding='utf-8').read().strip(); n=len(t); print(f'{n}자'); sys.exit(0 if 0<n<=500 else '새로운 기능 문구는 1~500자여야 한다')" distribution/whats_new.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 내부 테스트·프로덕션에 같은 versionCode 를 올리고 프로덕션 심사 제출까지 커밋한다.
      - name: Upload and submit for review
        id: play
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          PACKAGE_NAME: app.threedollars.manager
          AAB_PATH: ${{ steps.aab.outputs.path }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          WHATS_NEW_PATH: distribution/whats_new.txt
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          pip install -q google-api-python-client==2.151.0 google-auth==2.36.0
          python .github/scripts/play_release.py

      - name: Notify Discord
        if: ${{ always() && !inputs.dry_run }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          OUTCOME: ${{ job.status }}
          SUBMITTED: ${{ steps.play.outputs.submitted }}
          RELEASE_NAME: ${{ steps.version.outputs.release_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$OUTCOME" != "success" ]; then
            TITLE="[사장님앱] Play Store 업로드 실패"; COLOR=15158332
          elif [ "$SUBMITTED" = "true" ]; then
            TITLE="[사장님앱] Play Store 심사 제출 완료"; COLOR=3066993
          else
            TITLE="[사장님앱] Play Store 업로드 완료 — 콘솔에서 검토를 위해 보내기 필요"; COLOR=15105570
          fi
          PAYLOAD=$(jq -n \
            --arg title "$TITLE" --argjson color "$COLOR" \
            --arg release_name "${RELEASE_NAME:-?}" --arg version_code "${VERSION_CODE:-?}" --arg url "$WORKFLOW_URL" \
            '{
              username: "가슴속삼천원 배포 알림",
              allowed_mentions: {parse: []},
              embeds: [{
                title: $title,
                color: $color,
                description: ("[워크플로 실행 결과](" + $url + ")"),
                fields: [
                  {name: "Version", value: $release_name, inline: true},
                  {name: "Version Code", value: $version_code, inline: true}
                ]
              }]
            }')
          curl --fail-with-body --silent --show-error --retry 2 \
            --header "Content-Type: application/json" \
            --data "$PAYLOAD" \
            "${DISCORD_WEBHOOK_URL}?wait=true" > /dev/null
